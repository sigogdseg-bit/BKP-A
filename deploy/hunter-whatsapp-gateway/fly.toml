app = "gd-whatsapp-gateway"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8082"
  WHATSAPP_SESSION_DIR = "/data/session-gd"
  HUNTER_WHATSAPP_TOKEN = "hunter-guardiao-whatsapp-secret-key-2026"
  GD_WHATSAPP_TOKEN = "gd-whatsapp-secret-key-2026"

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "gd_whatsapp_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

app = "hunter-gps-gateway"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTA_TCP = "7003"
  PORTA_HTTP = "8080"
  SUPABASE_URL = "https://pflzopmxxawyqkgrlapq.supabase.co"

[[services]]
  internal_port = 7003
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7003

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 8080

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
